<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Downage Page</title>
  <meta name="description" content="Downage page">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="down.css">
  <style>
    body {
      background-color: #4A2C2A;
      display: flex;
      justify-content: center; 
      align-items: center;
      min-height: 100vh;  
      text-align: center;
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    .top-nav {
      background-color: #4A87FF;
    }

    button {
      margin-top: 10px;
      padding: 10px 18px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0a58ca;
    }

    code {
      font-family: Consolas, monospace;
      font-size: 0.9rem;
      background-color: rgba(255,255,255,0.05);
      padding: 12px;
      display: block;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .video-showcase {
      margin-top: 60px;
      text-align: center;
    }

    .video-showcase p {
      font-weight: bold;
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    video {
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
      max-width: 100%;
    }
  </style>
</head>
<body>

  <main class="container my-5">
    <h1 class="section-title text-center">Temporary Downage</h1>
    <p class="text-center fst-italic text-muted small mb-4">
      27/8/2026 8:25 pm GMT+10
    </p>

    <p>
      Main page is temporarily down apologies for any inconvenience. The delay is taking a while more then expected.
    </p>



  <footer class="text-center py-4">
    <div class="container">
      <small>Down status page</small>
    </div>
  </footer>
</body>
</html>
